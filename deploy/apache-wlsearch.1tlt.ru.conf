# wlsearch.1tlt.ru — HTTP (:80)
# sudo cp deploy/apache-wlsearch.1tlt.ru.conf /etc/apache2/sites-available/wlsearch.1tlt.ru.conf
# sudo a2ensite wlsearch.1tlt.ru.conf
# sudo a2enmod rewrite proxy proxy_fcgi setenvif headers ssl
# sudo apache2ctl configtest && sudo systemctl reload apache2
#
# PHP-FPM: TCP 127.0.0.1:9000 (не unix-socket)
# Не используйте CGIPassAuth в VirtualHost на этой сборке Apache.

<VirtualHost *:80>
    ServerName wlsearch.1tlt.ru

    # После certbot / при Cloudflare Full — редирект на HTTPS.
    # Если нужно временно отладить по HTTP — закомментируйте Rewrite* ниже
    # и раскомментируйте DocumentRoot/Directory/FilesMatch блок.
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*)$ https://wlsearch.1tlt.ru/$1 [R=301,L]

    # ACME / на всякий случай (если когда-нибудь уберёте редирект выше)
    DocumentRoot /ssd/www/wlsearch/public

    <Directory /ssd/www/wlsearch>
        Require all denied
    </Directory>

    <Directory /ssd/www/wlsearch/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ /ssd/www/wlsearch/public/.well-known/acme-challenge/
    <Directory /ssd/www/wlsearch/public/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wlsearch_error.log
    CustomLog ${APACHE_LOG_DIR}/wlsearch_access.log combined
</VirtualHost>
