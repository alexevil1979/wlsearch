# wlsearch.1tlt.ru — Apache2 vhost (draft)
# Install:
#   sudo cp deploy/apache-wlsearch.1tlt.ru.conf /etc/apache2/sites-available/wlsearch.1tlt.ru.conf
#   sudo a2ensite wlsearch.1tlt.ru.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# Then: sudo certbot --apache -d wlsearch.1tlt.ru
#
# NOTE: Do NOT use CGIPassAuth here — on some Apache builds it is invalid in
# <VirtualHost> and breaks configtest. Authorization is passed via SetEnvIf
# + public/.htaccess RewriteRule (see below).

<VirtualHost *:80>
    ServerName wlsearch.1tlt.ru
    DocumentRoot /ssd/www/wlsearch/public

    # Block direct access to app root if mis-aliased; only public is DocumentRoot
    <Directory /ssd/www/wlsearch>
        Require all denied
    </Directory>

    <Directory /ssd/www/wlsearch/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Optional IP allowlist (uncomment & edit):
        # Require ip 203.0.113.10
        # Require ip 10.0.0.0/8
    </Directory>

    # PHP-FPM — adjust socket path if needed (ls /run/php/*.sock)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Pass Authorization to PHP (phone-agent Bearer). No CGIPassAuth.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/wlsearch_error.log
    CustomLog ${APACHE_LOG_DIR}/wlsearch_access.log combined
</VirtualHost>

# After certbot, an SSL vhost will be generated automatically.
# Ensure DocumentRoot stays /ssd/www/wlsearch/public, PHP handler remains php8.2-fpm,
# and remove any CGIPassAuth lines that certbot/old conf may have copied.
