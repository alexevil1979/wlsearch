# wlsearch.1tlt.ru — HTTPS (:443) + Let's Encrypt
# sudo cp deploy/apache-wlsearch.1tlt.ru-le-ssl.conf /etc/apache2/sites-available/wlsearch.1tlt.ru-le-ssl.conf
# sudo a2ensite wlsearch.1tlt.ru-le-ssl.conf
# sudo a2enmod rewrite proxy proxy_fcgi setenvif headers ssl
# sudo apache2ctl configtest && sudo systemctl reload apache2
#
# PHP-FPM: proxy:fcgi://127.0.0.1:9000
# Cloudflare: SSL mode Full / Full (strict). На :443 НЕ должно быть Redirect на https:// (иначе петля).
# Не используйте CGIPassAuth в VirtualHost.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wlsearch.1tlt.ru
    DocumentRoot /ssd/www/wlsearch/public

    <Directory /ssd/www/wlsearch>
        Require all denied
    </Directory>

    <Directory /ssd/www/wlsearch/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Optional IP allowlist:
        # Require ip 203.0.113.10
    </Directory>

    # PHP 8.2-FPM via TCP
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Authorization → PHP (phone-agent Bearer). Дублируется в public/.htaccess.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # open_basedir: раскомментируйте, если FPM/pool режет путь
    # php_admin_value open_basedir "/ssd/www/wlsearch:/tmp:/usr/local/php82:/dev/urandom"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/wlsearch_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/wlsearch_ssl_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/wlsearch.1tlt.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wlsearch.1tlt.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
