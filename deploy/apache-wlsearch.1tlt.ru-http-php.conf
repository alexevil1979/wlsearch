# Optional: HTTP vhost that also serves PHP on :80 (debug / no redirect)
# Обычно не нужен: используйте apache-wlsearch.1tlt.ru.conf (redirect) + le-ssl.
#
# PHP-FPM TCP 127.0.0.1:9000

<VirtualHost *:80>
    ServerName wlsearch.1tlt.ru
    DocumentRoot /ssd/www/wlsearch/public

    <Directory /ssd/www/wlsearch>
        Require all denied
    </Directory>

    <Directory /ssd/www/wlsearch/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog ${APACHE_LOG_DIR}/wlsearch_error.log
    CustomLog ${APACHE_LOG_DIR}/wlsearch_access.log combined
</VirtualHost>
